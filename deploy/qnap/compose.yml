# Bulanci in the browser on the QNAP.  In .env next to this file:
#   BULANCI_GAME=/share/Public/Bulanci/game       the folder with bulanci.exe
#   BULANCI_MODULE=/share/Public/Bulanci/module   the folder with wc3.wasm
#   BULANCI_LOGS=/share/Public/Bulanci/logs       the test pages' logs
#   BULANCI_PORT=8088                             8080 is QTS's own, 8086/8087 the WC3 and CMR trials
#   TUNNEL_TOKEN=...                              only for the tunnel profile
# then:  docker compose up -d --build            (and with HTTPS from Cloudflare: docker compose --profile tunnel up -d)
services:
  server:
    build: .
    image: bulanci-web
    restart: unless-stopped
    ports: ["${BULANCI_PORT:-8088}:8088"]
    volumes:
      - ${BULANCI_GAME:?set BULANCI_GAME in .env}:/game:ro
      - ${BULANCI_MODULE:?set BULANCI_MODULE in .env}:/module:ro
      - ${BULANCI_LOGS:?set BULANCI_LOGS in .env}:/logs
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  # HTTPS for the players (WebGPU and the game's threads need a secure page): a Cloudflare Tunnel, its public
  # hostname's service http://server:8088 (Cloudflare Zero Trust, Networks, Tunnels)
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [server]
